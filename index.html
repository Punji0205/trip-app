<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1FBFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root { --bg: #F1FBFF; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { position: fixed; inset: 0; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- 기존 Trip Planner 웹앱(누구나 접근 + 자체 이름·PIN 로그인)을 그대로 띄우는 껍데기. 키 없음.
     위치(내 위치)·복사·공유 기능이 안쪽 화면에서 되도록 allow로 넘겨 준다. -->
<iframe id="app" title="Trip Planner" allow="geolocation; clipboard-write; web-share"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycby6DtualCUG-qNY89ExD7_BA3bgtQU2ewpLB2BitLYgzhuIRrJI0frgBDZED7paU0Ll/exec';
  // 껍데기 주소 뒤의 ?share=코드 같은 값은 그대로 웹앱에 넘김
  document.getElementById('app').src = EXEC + (location.search || '');
</script>
</body>
</html>
